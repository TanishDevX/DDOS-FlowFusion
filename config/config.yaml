# config/config.yaml
# All hyperparameters and paths live here — tuned for T4 GPU (Lightning AI)

project:
  name: "DDoS Detection — Leakage-Free Flow Benchmark"
  version: "1.0.0"

data:
  train_dir: "data/raw/01-12/"
  test_dir:  "data/raw/03-11/"
  processed_dir: "data/processed/"
  samples_per_class: 25000

  # Train-set classes (6 total). BENIGN rows pooled from all files (~31k available).
  classes:
    - "BENIGN"
    - "DrDoS_LDAP"
    - "DrDoS_MSSQL"
    - "DrDoS_NetBIOS"
    - "DrDoS_UDP"
    - "Syn"

  # Test CSVs use different label strings (no DrDoS_ prefix).
  # Map test labels → canonical train labels before encoding.
  test_label_map:
    "BENIGN":   "BENIGN"
    "LDAP":     "DrDoS_LDAP"
    "MSSQL":    "DrDoS_MSSQL"
    "NetBIOS":  "DrDoS_NetBIOS"
    "UDP":      "DrDoS_UDP"
    "Syn":      "Syn"

  # Classes to skip entirely (no cross-session counterpart or too few rows)
  exclude_classes:
    - "DrDoS_DNS"
    - "DrDoS_NTP"
    - "DrDoS_SNMP"
    - "DrDoS_SSDP"
    - "TFTP"
    - "UDP-lag"
    - "UDPLag"
    - "WebDDoS"
    - "Portmap"

  val_split: 0.2
  random_state: 42

preprocessing:
  scaler: "robust"          # Options: robust, standard, quantile
  nan_strategy: "median"    # Fill NaN with column median
  inf_strategy: "nan"       # Replace ±inf with NaN first
  nan_threshold: 0.5        # Drop columns with >50% NaN
  drop_features:
    - "Unnamed: 0"   # leftover index column from CICFlowMeter export
    - "Flow ID"
    - "Source IP"
    - "Destination IP"
    - "Timestamp"
    - "SimillarHTTP"
    - "Inbound"      # direction flag — leaky for cross-session generalization

training:
  seeds: [42, 123, 456, 789, 1024]
  batch_size: 512
  epochs: 80                       # T4 GPU calibrated budget
  learning_rate: 0.001
  early_stopping_patience: 15
  lr_reduce_patience: 5
  lr_reduce_factor: 0.5
  min_lr: 0.000001
  use_augmentation: true
  aug_gaussian_sigma: 0.01
  aug_mixup_alpha: 0.2
  aug_n_gaussian: 10000
  aug_n_mixup: 10000

models:
  mlp:
    # Architecture — residual MLP
    layers: [512, 256, 128, 64]
    dropout: [0.3, 0.3, 0.3, 0.2]
    activation: "swish"        # SiLU/Swish outperforms ReLU on tabular data
    batch_norm: true           # uses LayerNorm
    use_residual: true         # ResNet-style skip connections
    epochs: 80
    warmup_epochs: 5
    # Training
    learning_rate: 0.001
    weight_decay: 0.00001
    label_smoothing: 0.05      # smooths BENIGN class boundary

  ft_transformer:
    d_token: 128               # feature embedding capacity
    n_heads: 8
    n_layers: 4                # Transformer depth
    ffn_ratio: 4
    head_pooling: "cls_mean"   # CLS + mean-pool concatenation head
    epochs: 60
    warmup_epochs: 5
    attention_dropout: 0.2
    ffn_dropout: 0.1
    learning_rate: 0.0001
    weight_decay: 0.00001
    drop_path_rate: 0.1        # stochastic depth regularization
    warmup_steps: 500          # linear LR warmup
    label_smoothing: 0.05      # smooths class boundaries

  flow_fusion:
    d_token: 128               # v2: doubled from 64 to match standalone FT-Transformer capacity
    epochs: 120                # v2: extended from 80 — branches need more co-training time
    warmup_epochs: 8           # v2: longer warmup for stable multi-branch gradient flow

    # --- Branch 1: Tabular (FT-Transformer) ---
    n_heads: 8
    n_layers: 4                # v2: depth 3→4, matches standalone FT-Transformer
    attention_dropout: 0.2
    ffn_dropout: 0.1

    # --- Branch 2: Feature Interaction Network (FIN) ---
    # Replaces CNN spatial branch — explicit pairwise cross-group Hadamard interactions
    # With 5 semantic groups: C(5,2)+5 = 15 interaction tokens
    d_interaction: 64           # group/interaction embedding dimension
    interaction_dropout: 0.15   # dropout inside FIN Transformer
    n_interaction_heads: 4      # attention heads (must divide d_interaction)
    n_interaction_layers: 2     # Transformer layers over interaction tokens

    # --- Branch 3: Structural (Group Attention) ---
    d_group: 64                # v2: doubled from 32 — richer group embeddings
    group_heads: 8             # v2: must divide d_group=64 evenly
    group_dropout: 0.2
    n_group_layers: 3          # v2: deeper group transformer (2→3 layers)
    d_group_ffn_ratio: 2

    # --- Fusion ---
    gate_type: "contextual_scalar"
    label_smoothing: 0.05
    fusion_dropout: 0.15       # v2: slightly reduced to allow more signal through
    gate_temperature_start: 1.0
    gate_temperature_end: 0.3
    use_fusion_hidden: true
    use_cross_branch_attention: true   # v2: branches attend to each other before gating

    # --- Focal Loss ---
    use_focal_loss: true       # v2: targets hard classes like DrDoS_MSSQL
    focal_gamma: 2.0           # standard focusing parameter

    # --- Training ---
    learning_rate: 0.00015     # v2: slightly higher LR with longer warmup
    weight_decay: 0.00001
    clipnorm: 1.0
    warmup_steps: 1200

  # --- Ablation configurations ---
  ablation:
    mode: "all_gated"
    run_all: false            # Final run: train all_gated configuration

  xgboost:
    max_depth: 10
    learning_rate: 0.1
    n_estimators: 1500        # T4 GPU hist mode handles 1500 trees fast
    subsample: 0.8
    colsample_bytree: 0.8
    colsample_bylevel: 0.8
    min_child_weight: 5
    gamma: 0.1
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 40
    tree_method: "hist"

  lightgbm:
    boosting_type: "gbdt"
    num_leaves: 255
    learning_rate: 0.1
    n_estimators: 1000
    subsample: 0.8
    colsample_bytree: 0.8
    feature_fraction_bynode: 0.8
    min_child_samples: 50
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 40
    class_weight: "balanced"

evaluation:
  results_dir: "experiments/results/"
  metrics:
    - "accuracy"
    - "macro_f1"
    - "weighted_f1"
    - "macro_precision"
    - "macro_recall"
    - "roc_auc"
    - "pr_auc"

deployment:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/xgb_model.joblib"
  scaler_path: "models/scaler.joblib"
